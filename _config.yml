# GitHub Pages (Jekyll) settings for gidsnederland.nl.
# The site is plain HTML; Jekyll only copies files. The folders below are
# working files for the maintainers and the automation agents and must not be
# published on the website.
exclude:
  - docs
  - reports
  - tools
  - cloudflare
  - .github
  - README.md
# Jekyll's exclude also matches by prefix, so "tools" above would hide the
# public tools.html page (it returned 404). Re-include it explicitly.
include:
  - tools.html

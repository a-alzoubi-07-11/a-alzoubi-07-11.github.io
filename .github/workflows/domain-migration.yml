name: Domain migration to gidsnederland.nl

on:
  push:
    paths:
      - '.github/workflows/domain-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create migration branch
        shell: bash
        run: git checkout -B domain-migration-gidsnederland

      - name: Replace legacy GitHub Pages domain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://a-alzoubi-07-11.github.io'
          new = 'https://gidsnederland.nl'
          allowed = {'.html', '.xml', '.txt', '.json', '.js', '.css', '.webmanifest', '.md'}
          skip_dirs = {'.git', '.github', '__pycache__', 'reports'}

          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if any(part in skip_dirs for part in p.parts):
                  continue
              if p.suffix.lower() not in allowed and p.name != 'CNAME':
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(str(p))

          print(f'Updated {len(changed)} files')
          for p in changed:
              print(p)
          PY

      - name: Ensure domain support files
        shell: bash
        run: |
          printf 'gidsnederland.nl\n' > CNAME
          python - <<'PY'
          from pathlib import Path
          p = Path('robots.txt')
          if p.exists():
              lines = [ln for ln in p.read_text(encoding='utf-8').splitlines() if not ln.lower().startswith('sitemap:')]
              lines.append('Sitemap: https://gidsnederland.nl/sitemap.xml')
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit and push migration branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate site URLs to gidsnederland.nl'
          git push --force origin HEAD:refs/heads/domain-migration-gidsnederland
